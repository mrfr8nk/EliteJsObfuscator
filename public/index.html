<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MR FRANK Obfuscator</title>
  <style>
    :root {
      --navy-blue: #0a192f;
      --light-navy: #172a45;
      --lightest-navy: #303C55;
      --slate: #8892b0;
      --light-slate: #a8b2d1;
      --lightest-slate: #ccd6f6;
      --white: #e6f1ff;
      --accent: #64ffda;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background: linear-gradient(135deg, var(--navy-blue) 0%, var(--light-navy) 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      color: var(--white);
    }

    .glass-card {
      background: rgba(10, 25, 47, 0.7);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border-radius: 15px;
      border: 1px solid rgba(100, 255, 218, 0.2);
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
      padding: 2rem;
      width: 100%;
      max-width: 600px;
      transition: all 0.3s ease;
    }

    .glass-card:hover {
      box-shadow: 0 8px 32px 0 rgba(100, 255, 218, 0.1);
      border: 1px solid rgba(100, 255, 218, 0.3);
    }

    h1 {
      text-align: center;
      margin-bottom: 1.5rem;
      color: var(--accent);
      font-weight: 600;
    }

    .form-group {
      margin-bottom: 1.5rem;
    }

    label {
      display: block;
      margin-bottom: 0.5rem;
      color: var(--light-slate);
      font-size: 0.9rem;
    }

    input, textarea {
      width: 100%;
      padding: 0.8rem 1rem;
      background: rgba(23, 42, 69, 0.5);
      border: 1px solid rgba(100, 255, 218, 0.1);
      border-radius: 8px;
      color: var(--white);
      font-size: 1rem;
      transition: all 0.3s ease;
    }

    input:focus, textarea:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 2px rgba(100, 255, 218, 0.2);
    }

    button {
      width: 100%;
      padding: 1rem;
      background: rgba(100, 255, 218, 0.1);
      border: 1px solid var(--accent);
      border-radius: 8px;
      color: var(--accent);
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    button:hover {
      background: rgba(100, 255, 218, 0.2);
      transform: translateY(-2px);
    }

    #result {
      margin-top: 1.5rem;
      padding: 1rem;
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.05);
      display: none;
    }

    .logo {
      text-align: center;
      margin-bottom: 1rem;
      font-size: 1.5rem;
      font-weight: 700;
      color: var(--accent);
    }

    .security-note {
      font-size: 0.8rem;
      color: var(--slate);
      margin-top: 1rem;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="glass-card">
    <div class="logo">// MR FRANK</div>
    <h1>GitHub Obfuscator</h1>
    
    <form id="obfuscateForm">
      <div class="form-group">
        <label for="sourceRepo">Source Repository URL</label>
        <input type="text" id="sourceRepo" name="sourceRepo" placeholder="https://github.com/user/repo" required>
      </div>
      
      <div class="form-group">
        <label for="destRepo">Destination Repository URL</label>
        <input type="text" id="destRepo" name="destRepo" placeholder="https://github.com/user/repo" required>
      </div>
      
      <div class="form-group">
        <label for="token">GitHub Token (optional if using .env)</label>
        <input type="password" id="token" name="token" placeholder="ghp_yourTokenHere">
      </div>
      
      <div class="form-group">
        <label for="gitUser">Git Username</label>
        <input type="text" id="gitUser" name="gitUser" placeholder="Your Git Username" required>
      </div>
      
      <div class="form-group">
        <label for="gitEmail">Git Email</label>
        <input type="email" id="gitEmail" name="gitEmail" placeholder="your.email@example.com" required>
      </div>
      
      <button type="submit">Obfuscate & Push</button>
    </form>
    
    <div id="result"></div>
    
    <p class="security-note">
      Note: Tokens are never stored. For security, we recommend using environment variables.
    </p>
  </div>

  <script>
    document.getElementById('obfuscateForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const formData = new FormData(e.target);
      const button = e.target.querySelector('button');
      const resultDiv = document.getElementById('result');
      
      button.disabled = true;
      button.textContent = 'Processing...';
      resultDiv.style.display = 'none';
      
      try {
        const response = await fetch('/obfuscate', {
          method: 'POST',
          body: new URLSearchParams(formData)
        });
        
        const data = await response.json();
        resultDiv.textContent = data.success ? data.message : data.error;
        resultDiv.style.display = 'block';
        resultDiv.style.color = data.success ? '#64ffda' : '#ff6b6b';
        
        if (data.success) {
          e.target.reset();
        }
      } catch (err) {
        resultDiv.textContent = 'Network error: ' + err.message;
        resultDiv.style.display = 'block';
        resultDiv.style.color = '#ff6b6b';
      } finally {
        button.disabled = false;
        button.textContent = 'Obfuscate & Push';
      }
    });
  </script>
</body>
</html>

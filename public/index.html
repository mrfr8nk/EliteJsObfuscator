<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MR FRANK Obfuscator</title>
  <style>
    :root {
      --navy: #0a192f;
      --light-navy: #172a45;
      --slate: #8892b0;
      --light-slate: #a8b2d1;
      --white: #e6f1ff;
      --accent: #64ffda;
    }
    
    body {
      background: var(--navy);
      color: var(--white);
      font-family: 'Segoe UI', sans-serif;
      line-height: 1.6;
      padding: 20px;
    }
    
    .container {
      max-width: 600px;
      margin: 0 auto;
      background: rgba(10, 25, 47, 0.7);
      backdrop-filter: blur(10px);
      border-radius: 10px;
      padding: 30px;
      box-shadow: 0 4px 30px rgba(0, 0, 0, 0.1);
      border: 1px solid rgba(100, 255, 218, 0.2);
    }
    
    h1 {
      color: var(--accent);
      text-align: center;
      margin-bottom: 20px;
    }
    
    .form-group {
      margin-bottom: 20px;
    }
    
    label {
      display: block;
      margin-bottom: 8px;
      color: var(--light-slate);
    }
    
    input {
      width: 100%;
      padding: 12px;
      background: rgba(23, 42, 69, 0.5);
      border: 1px solid var(--light-navy);
      border-radius: 5px;
      color: var(--white);
      font-size: 16px;
    }
    
    button {
      width: 100%;
      padding: 14px;
      background: rgba(100, 255, 218, 0.1);
      color: var(--accent);
      border: 1px solid var(--accent);
      border-radius: 5px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
    }
    
    button:hover {
      background: rgba(100, 255, 218, 0.2);
    }
    
    #result {
      margin-top: 20px;
      padding: 15px;
      border-radius: 5px;
      display: none;
    }
    
    .error {
      background: rgba(255, 100, 100, 0.1);
      border: 1px solid #ff6b6b;
      color: #ff6b6b;
    }
    
    .success {
      background: rgba(100, 255, 218, 0.1);
      border: 1px solid var(--accent);
      color: var(--accent);
    }
    
    .note {
      font-size: 14px;
      color: var(--slate);
      margin-top: 20px;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>GitHub Obfuscator</h1>
    
    <form id="obfuscateForm">
      <div class="form-group">
        <label for="sourceRepo">Source Repository URL</label>
        <input type="text" id="sourceRepo" name="sourceRepo" placeholder="https://github.com/username/repo" required>
      </div>
      
      <div class="form-group">
        <label for="destRepo">Destination Repository URL</label>
        <input type="text" id="destRepo" name="destRepo" placeholder="https://github.com/username/repo" required>
      </div>
      
      <div class="form-group">
        <label for="token">GitHub Token</label>
        <input type="password" id="token" name="token" placeholder="ghp_yourTokenHere" required>
      </div>
      
      <div class="form-group">
        <label for="gitUser">Git Username</label>
        <input type="text" id="gitUser" name="gitUser" placeholder="YourUsername" required>
      </div>
      
      <div class="form-group">
        <label for="gitEmail">Git Email</label>
        <input type="email" id="gitEmail" name="gitEmail" placeholder="your.email@example.com" required>
      </div>
      
      <button type="submit">Obfuscate & Push</button>
    </form>
    
    <div id="result"></div>
    
    <p class="note">
      Note: Tokens are never stored. For security, we recommend using environment variables.
    </p>
  </div>

  <script>
    document.getElementById('obfuscateForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const form = e.target;
      const button = form.querySelector('button');
      const resultDiv = document.getElementById('result');
      
      button.disabled = true;
      button.textContent = 'Processing...';
      resultDiv.style.display = 'none';
      
      try {
        const response = await fetch('/obfuscate', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/x-www-form-urlencoded',
            'Accept': 'application/json'
          },
          body: new URLSearchParams(new FormData(form))
        });
        
        const data = await response.json();
        
        if (!response.ok) {
          throw new Error(data.error || data.message || 'Unknown error');
        }
        
        resultDiv.textContent = data.message || 'Success!';
        resultDiv.className = 'success';
        resultDiv.style.display = 'block';
        form.reset();
        
      } catch (err) {
        resultDiv.textContent = err.message;
        resultDiv.className = 'error';
        resultDiv.style.display = 'block';
        console.error('Error:', err);
      } finally {
        button.disabled = false;
        button.textContent = 'Obfuscate & Push';
      }
    });
  </script>
</body>
</html>
